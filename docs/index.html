<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting to LatexDo Docs</title>
    <meta name="robots" content="noindex, follow" />
    <meta http-equiv="refresh" content="0; url=https://docs.latexdo.org/" />
    <link rel="canonical" href="https://docs.latexdo.org/" />
    <link rel="icon" type="image/svg+xml" href="../assets/icon.svg" />
    <link rel="stylesheet" href="../style.css" />
  </head>
  <body>
    <a class="skip-link" href="#content">Skip to content</a>

    <header class="site-header" data-header>

          <span>LatexDo</span>
        </a>
        <button
          class="nav-toggle"
          type="button"
          aria-expanded="false"
          aria-controls="nav-links"
          data-nav-toggle

          <span></span>
          <span></span>
        </button>
        <div id="nav-links" class="nav-links" data-nav-links>
          <a href="../downloads/">Download</a>
          <a class="nav-editor-link" href="https://editor.latexdo.org">Editor</a>
          <a href="../cli/">CLI</a>
          <a href="../about/">About</a>
        </div>
      </nav>
    </header>

    <main id="content" class="section-band">
      <div class="section-inner">
        <p>
          Redirecting to
          <a href="https://docs.latexdo.org/">docs.latexdo.org</a>.
        </p>
      </div>
    </main>
    <script>
      window.location.replace("https://docs.latexdo.org/");
    </script>
    <script type="module" src="../assets/site.js"></script>

</html>
