<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{title}} - LatexDo</title>
    <meta name="description" content="{{description}}" />
    <meta name="author" content="LatexDo" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="https://latexdo.org{{path}}" />
    <link rel="icon" type="image/svg+xml" href="/assets/icon.svg" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/assets/pages.css" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="LatexDo" />
    <meta property="og:title" content="{{title}} - LatexDo" />
    <meta property="og:description" content="{{description}}" />
    <meta property="og:url" content="https://latexdo.org{{path}}" />
    <meta property="og:image" content="https://latexdo.org/assets/social-preview.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="LatexDo, the free LaTeX editor: source and compiled PDF side by side." />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@latexdoproject" />
    <meta name="twitter:title" content="{{title}} - LatexDo" />
    <meta name="twitter:description" content="{{description}}" />
    <meta name="twitter:image" content="https://latexdo.org/assets/social-preview.png" />
    <script type="application/ld+json">
{{jsonld}}
    </script>
  </head>
  <body>
    <a class="skip-link" href="#content">Skip to content</a>

    <div data-header-src="/partials/header.html"></div>

    <main id="content" class="lx">
{{content}}
    </main>
    <div data-footer-src="/partials/footer.html"></div>

    <script type="module" src="/assets/site.js"></script>
  </body>
</html>
